plugins {
    id "com.android.application"
}

android {
    namespace "app.drover.quest"
    compileSdk 34

    defaultConfig {
        applicationId "app.drover.quest"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // This APK intentionally targets Quest 3 (ARM64 / Android 14).
        disable "ChromeOsAbiSupport", "OldTargetApi"
    }
}
