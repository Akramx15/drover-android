plugins {
    id "com.android.application"
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.isBlank() }

android {
    namespace = "app.drover.android"
    compileSdk = 36

    defaultConfig {
        applicationId = "app.drover.android"
        minSdk = 29
        targetSdk = 36
        versionCode = 2
        versionName = "0.2.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    flavorDimensions += "distribution"
    productFlavors {
        universal {
            dimension = "distribution"
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }

        arm64 {
            dimension = "distribution"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        profile {
            initWith release
            debuggable = true
            jniDebuggable = true
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.debug
            matchingFallbacks = ["release"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Keep native libraries uncompressed so AGP can page-align them for
            // Android devices that use a 16 KiB memory page size.
            useLegacyPackaging = false
            // build-android.ps1 already strips the packaged libraries and emits
            // separate DWARF files under app/build/native-symbols.
            keepDebugSymbols += ["**/libtun2proxy.so"]
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        disable "ChromeOsAbiSupport"
    }
}
