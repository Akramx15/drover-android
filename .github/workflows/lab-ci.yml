name: WhatsApp Lab CI

on:
  push:
    branches:
      - "experiment/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 26.1.10909125
  TUN2PROXY_COMMIT: fc77ca3182b3a63b84266bb0a5d24c096e022765

jobs:
  android:
    name: Android lab APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path is missing}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Check out pinned tun2proxy source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tun2proxy-android"
          git -C "$RUNNER_TEMP/tun2proxy-android" remote add origin \
            https://github.com/tun2proxy/tun2proxy.git
          git -C "$RUNNER_TEMP/tun2proxy-android" fetch --depth=1 origin "$TUN2PROXY_COMMIT"
          git -C "$RUNNER_TEMP/tun2proxy-android" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tun2proxy-android" rev-parse HEAD)" = "$TUN2PROXY_COMMIT"

      - name: Rebuild Android native libraries
        shell: pwsh
        run: >-
          ./native/build-android.ps1
          -SourceDir "$env:RUNNER_TEMP/tun2proxy-android"
          -NdkRoot "$env:ANDROID_NDK_ROOT"

      - name: Verify bundled third-party licenses
        shell: bash
        run: |
          set -euo pipefail
          CARGO_EXACT="$(rustup which --toolchain 1.97.1 cargo)"
          RUSTC_EXACT="$(rustup which --toolchain 1.97.1 rustc)"
          python .github/scripts/generate-third-party-licenses.py \
            --inventory DEPENDENCY_LICENSES.md \
            --tun2proxy-manifest "$RUNNER_TEMP/tun2proxy-android/Cargo.toml" \
            --project-license LICENSE \
            --cargo "$CARGO_EXACT" \
            --rustc "$RUSTC_EXACT" \
            --output app/src/main/assets/third_party_licenses.txt \
            --check
          python -m py_compile \
            .github/scripts/generate-third-party-licenses.py \
            .github/scripts/verify-release.py

      - name: Lint, test, and build the lab APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            lintUniversalDebug \
            lintArm64Debug \
            testUniversalDebugUnitTest \
            testArm64DebugUnitTest \
            assembleUniversalDebug \
            assembleArm64Debug

      - name: Stage Android lab artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            dist/android/Drover-WhatsApp-Lab-v0.3.0-alpha.1-universal-debug.apk
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk \
            dist/android/Drover-WhatsApp-Lab-v0.3.0-alpha.1-arm64-v8a-debug.apk
          (
            cd dist/android
            sha256sum *.apk > SHA256SUMS.txt
          )

      - name: Upload Android lab APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Drover-WhatsApp-Lab-v0.3.0-alpha.1-Android
          path: dist/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    name: Unsigned iOS device build
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.1"
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out pinned tun2proxy source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tun2proxy"
          git -C "$RUNNER_TEMP/tun2proxy" remote add origin \
            https://github.com/tun2proxy/tun2proxy.git
          git -C "$RUNNER_TEMP/tun2proxy" fetch --depth=1 origin "$TUN2PROXY_COMMIT"
          git -C "$RUNNER_TEMP/tun2proxy" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tun2proxy" rev-parse HEAD)" = "$TUN2PROXY_COMMIT"

      - name: Build the patched device XCFramework
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup >/dev/null
          chmod +x native/build-apple.sh
          ./native/build-apple.sh \
            "$RUNNER_TEMP/tun2proxy" \
            "$GITHUB_WORKSPACE/ios/Generated/tun2proxy.xcframework"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          DESTINATION="$RUNNER_TEMP/xcodegen-release"
          curl --fail --location --retry 3 \
            --output "$ARCHIVE" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${ARCHIVE}" | shasum -a 256 --check
          mkdir -p "$DESTINATION"
          ditto -x -k "$ARCHIVE" "$DESTINATION"
          test -x "$DESTINATION/xcodegen/bin/xcodegen"
          "$DESTINATION/xcodegen/bin/xcodegen" --version | grep -F "$XCODEGEN_VERSION"
          echo "XCODEGEN=${DESTINATION}/xcodegen/bin/xcodegen" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          "$XCODEGEN" generate --spec project.yml

      - name: Build for an iOS device without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/DroverLab.xcodeproj \
            -scheme DroverLab \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DroverLabDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stage the unsigned iOS result
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$RUNNER_TEMP/DroverLabDerivedData/Build/Products/Debug-iphoneos/Drover Lab.app"
          test -d "$PRODUCT"
          test -f "$PRODUCT/third_party_licenses.txt"
          mkdir -p dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            "$PRODUCT" \
            dist/ios/DroverLab-v0.3.0-alpha.1-unsigned-device-app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            ios/Generated/tun2proxy.xcframework \
            dist/ios/tun2proxy-v0.3.0-alpha.1-apple-xcframework.zip
          (
            cd dist/ios
            shasum -a 256 *.zip > SHA256SUMS.txt
          )
          printf '%s\n' \
            'UNSIGNED BUILD: this artifact is for compilation review.' \
            'It is not an installable IPA. See ios/BUILDING.md for Development signing.' \
            > dist/ios/README.txt

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DroverLab-v0.3.0-alpha.1-iOS-unsigned
          path: dist/ios/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
