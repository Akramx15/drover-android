name: WhatsApp Lab CI

on:
  push:
    branches:
      - "experiment/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 26.1.10909125
  TUN2PROXY_COMMIT: fc77ca3182b3a63b84266bb0a5d24c096e022765

jobs:
  android:
    name: Android lab APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path is missing}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Check out pinned tun2proxy source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tun2proxy-android"
          git -C "$RUNNER_TEMP/tun2proxy-android" remote add origin \
            https://github.com/tun2proxy/tun2proxy.git
          git -C "$RUNNER_TEMP/tun2proxy-android" fetch --depth=1 origin "$TUN2PROXY_COMMIT"
          git -C "$RUNNER_TEMP/tun2proxy-android" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tun2proxy-android" rev-parse HEAD)" = "$TUN2PROXY_COMMIT"

      - name: Rebuild Android native libraries
        shell: pwsh
        run: >-
          ./native/build-android.ps1
          -SourceDir "$env:RUNNER_TEMP/tun2proxy-android"
          -NdkRoot "$env:ANDROID_NDK_ROOT"

      - name: Verify bundled third-party licenses
        shell: bash
        run: |
          set -euo pipefail
          CARGO_EXACT="$(rustup which --toolchain 1.97.1 cargo)"
          RUSTC_EXACT="$(rustup which --toolchain 1.97.1 rustc)"
          python .github/scripts/generate-third-party-licenses.py \
            --inventory DEPENDENCY_LICENSES.md \
            --tun2proxy-manifest "$RUNNER_TEMP/tun2proxy-android/Cargo.toml" \
            --project-license LICENSE \
            --cargo "$CARGO_EXACT" \
            --rustc "$RUSTC_EXACT" \
            --output app/src/main/assets/third_party_licenses.txt \
            --check
          python -m py_compile \
            .github/scripts/generate-third-party-licenses.py \
            .github/scripts/verify-release.py

      - name: Lint, test, and build the lab APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            lintUniversalDebug \
            lintArm64Debug \
            testUniversalDebugUnitTest \
            testArm64DebugUnitTest \
            assembleUniversalDebug \
            assembleArm64Debug

      - name: Stage Android lab artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            dist/android/Drover-WhatsApp-Lab-v0.3.0-alpha.1-universal-debug.apk
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk \
            dist/android/Drover-WhatsApp-Lab-v0.3.0-alpha.1-arm64-v8a-debug.apk
          (
            cd dist/android
            sha256sum *.apk > SHA256SUMS.txt
          )

      - name: Upload Android lab APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Drover-WhatsApp-Lab-v0.3.0-alpha.1-Android
          path: dist/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    name: Unsigned iOS device build
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.1"
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out pinned tun2proxy source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/tun2proxy"
          git -C "$RUNNER_TEMP/tun2proxy" remote add origin \
            https://github.com/tun2proxy/tun2proxy.git
          git -C "$RUNNER_TEMP/tun2proxy" fetch --depth=1 origin "$TUN2PROXY_COMMIT"
          git -C "$RUNNER_TEMP/tun2proxy" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tun2proxy" rev-parse HEAD)" = "$TUN2PROXY_COMMIT"

      - name: Build the patched device XCFramework
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup >/dev/null
          chmod +x native/build-apple.sh
          ./native/build-apple.sh \
            "$RUNNER_TEMP/tun2proxy" \
            "$GITHUB_WORKSPACE/ios/Generated/tun2proxy.xcframework"

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.zip"
          DESTINATION="$RUNNER_TEMP/xcodegen-release"
          curl --fail --location --retry 3 \
            --output "$ARCHIVE" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${ARCHIVE}" | shasum -a 256 --check
          mkdir -p "$DESTINATION"
          ditto -x -k "$ARCHIVE" "$DESTINATION"
          test -x "$DESTINATION/xcodegen/bin/xcodegen"
          "$DESTINATION/xcodegen/bin/xcodegen" --version | grep -F "$XCODEGEN_VERSION"
          echo "XCODEGEN=${DESTINATION}/xcodegen/bin/xcodegen" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          "$XCODEGEN" generate --spec project.yml
          cd ..
          git diff --exit-code -- \
            ios/DroverLab/Info.plist \
            ios/DroverLab/DroverLab.entitlements \
            ios/PacketTunnel/Info.plist \
            ios/PacketTunnel/PacketTunnel.entitlements
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          for entitlements in \
            ios/DroverLab/DroverLab.entitlements \
            ios/PacketTunnel/PacketTunnel.entitlements; do
            test "$($PLIST_BUDDY -c \
              'Print :com.apple.developer.networking.networkextension:0' \
              "$entitlements")" = packet-tunnel-provider
            test "$($PLIST_BUDDY -c \
              'Print :com.apple.security.application-groups:0' \
              "$entitlements")" = group.app.drover.ios.lab
          done
          check_setting() {
            local target="$1"
            local key="$2"
            local expected="$3"
            local settings="$RUNNER_TEMP/${target}-release-build-settings.txt"
            if [[ ! -f "$settings" ]]; then
              xcodebuild \
                -project ios/DroverLab.xcodeproj \
                -target "$target" \
                -configuration Release \
                -showBuildSettings > "$settings"
            fi
            local actual
            actual="$(sed -n "s/^[[:space:]]*$key = //p" "$settings" | tail -n 1)"
            test "$actual" = "$expected"
          }
          check_setting DroverLab INFOPLIST_FILE DroverLab/Info.plist
          check_setting DroverLab CODE_SIGN_ENTITLEMENTS DroverLab/DroverLab.entitlements
          check_setting DroverLab GENERATE_INFOPLIST_FILE NO
          check_setting PacketTunnel INFOPLIST_FILE PacketTunnel/Info.plist
          check_setting PacketTunnel CODE_SIGN_ENTITLEMENTS PacketTunnel/PacketTunnel.entitlements
          check_setting PacketTunnel GENERATE_INFOPLIST_FILE NO

      - name: Build for an iOS device without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/DroverLab.xcodeproj \
            -scheme DroverLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DroverLabDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify built iOS metadata and unsigned state
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DroverLabDerivedData/Build/Products/Release-iphoneos/Drover Lab.app"
          EXTENSION="$APP/PlugIns/PacketTunnel.appex"
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          MAPPING_ID=1D4D3F5C-8948-4B6D-9D3C-62C9C22E181B

          test -d "$EXTENSION"
          test "$($PLIST_BUDDY -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = \
            app.drover.ios.lab
          test "$($PLIST_BUDDY -c "Print :NETestAppMapping:$MAPPING_ID:0" "$APP/Info.plist")" = \
            net.whatsapp.WhatsApp
          test "$($PLIST_BUDDY -c "Print :NETestAppMapping:$MAPPING_ID:1" "$APP/Info.plist")" = \
            net.whatsapp.WhatsAppSMB
          test "$($PLIST_BUDDY -c 'Print :CFBundleIdentifier' "$EXTENSION/Info.plist")" = \
            app.drover.ios.lab.PacketTunnel
          test "$($PLIST_BUDDY -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXTENSION/Info.plist")" = \
            com.apple.networkextension.packet-tunnel
          test "$($PLIST_BUDDY -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXTENSION/Info.plist")" = \
            PacketTunnel.PacketTunnelProvider
          file "$APP/Drover Lab" | grep -F arm64
          file "$EXTENSION/PacketTunnel" | grep -F arm64
          if find "$APP" \
            \( -name _CodeSignature -o -name CodeResources \
               -o -name embedded.mobileprovision -o -iname '*.p12' \
               -o -iname '*.p8' -o -iname '*.pem' -o -iname '*.key' \) \
            -print -quit | grep . >/dev/null; then
            echo 'Unsigned product unexpectedly contains signing material.' >&2
            exit 1
          fi
          for executable in "$APP/Drover Lab" "$EXTENSION/PacketTunnel"; do
            if otool -l "$executable" | grep -F LC_CODE_SIGNATURE >/dev/null; then
              echo "Unsigned executable contains a code-signature load command: $executable" >&2
              exit 1
            fi
          done

      - name: Stage the unsigned iOS result
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$RUNNER_TEMP/DroverLabDerivedData/Build/Products/Release-iphoneos/Drover Lab.app"
          IPA_ROOT="$RUNNER_TEMP/DroverLabUnsignedIpa"
          IPA="$GITHUB_WORKSPACE/dist/ios/DroverLab-v0.3.0-alpha.1-unsigned-resign-input.ipa"
          test -d "$PRODUCT"
          test -f "$PRODUCT/third_party_licenses.txt"
          mkdir -p dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            "$PRODUCT" \
            dist/ios/DroverLab-v0.3.0-alpha.1-unsigned-device-app.zip
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$PRODUCT" "$IPA_ROOT/Payload/Drover Lab.app"
          (
            cd "$IPA_ROOT"
            ditto -c -k --sequesterRsrc --keepParent \
              Payload \
              "$IPA"
          )
          unzip -tqq "$IPA"
          unzip -Z1 "$IPA" | grep -Fx \
            'Payload/Drover Lab.app/PlugIns/PacketTunnel.appex/Info.plist'
          if unzip -Z1 "$IPA" | grep -E \
            '(^|/)(_CodeSignature|CodeResources)(/|$)|embedded\.mobileprovision$|\.(p12|p8|pem|key)$'; then
            echo 'Unsigned IPA unexpectedly contains signing material.' >&2
            exit 1
          fi
          VERIFY_ROOT="$RUNNER_TEMP/DroverLabUnsignedIpaVerify"
          ditto -x -k "$IPA" "$VERIFY_ROOT"
          VERIFY_APP="$VERIFY_ROOT/Payload/Drover Lab.app"
          test -x "$VERIFY_APP/Drover Lab"
          test -x "$VERIFY_APP/PlugIns/PacketTunnel.appex/PacketTunnel"
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          MAPPING_ID=1D4D3F5C-8948-4B6D-9D3C-62C9C22E181B
          test "$($PLIST_BUDDY -c 'Print :CFBundleIdentifier' "$VERIFY_APP/Info.plist")" = \
            app.drover.ios.lab
          test "$($PLIST_BUDDY -c "Print :NETestAppMapping:$MAPPING_ID:0" "$VERIFY_APP/Info.plist")" = \
            net.whatsapp.WhatsApp
          test "$($PLIST_BUDDY -c "Print :NETestAppMapping:$MAPPING_ID:1" "$VERIFY_APP/Info.plist")" = \
            net.whatsapp.WhatsAppSMB
          test "$($PLIST_BUDDY -c 'Print :CFBundleIdentifier' \
            "$VERIFY_APP/PlugIns/PacketTunnel.appex/Info.plist")" = \
            app.drover.ios.lab.PacketTunnel
          test "$($PLIST_BUDDY -c 'Print :NSExtension:NSExtensionPointIdentifier' \
            "$VERIFY_APP/PlugIns/PacketTunnel.appex/Info.plist")" = \
            com.apple.networkextension.packet-tunnel
          test "$($PLIST_BUDDY -c 'Print :NSExtension:NSExtensionPrincipalClass' \
            "$VERIFY_APP/PlugIns/PacketTunnel.appex/Info.plist")" = \
            PacketTunnel.PacketTunnelProvider
          ditto -c -k --sequesterRsrc --keepParent \
            ios/Generated/tun2proxy.xcframework \
            dist/ios/tun2proxy-v0.3.0-alpha.1-apple-xcframework.zip
          (
            cd dist/ios
            shasum -a 256 *.ipa *.zip > SHA256SUMS.txt
          )
          printf '%s\n' \
            'UNSIGNED BUILD: the resign-input IPA is not directly installable.' \
            'It contains no Apple certificate, provisioning profile, or registered-device data.' \
            'Both the host app and PacketTunnel.appex require matching Development signing.' \
            'Prefer rebuilding and exporting through Xcode; see ios/BUILDING.md.' \
            > dist/ios/README.txt

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DroverLab-v0.3.0-alpha.1-iOS-unsigned
          path: dist/ios/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
