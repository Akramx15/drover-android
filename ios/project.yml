name: DroverLab

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.1"
  xcodeVersion: "16.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.3.0
    SWIFT_VERSION: 5.10

targets:
  DroverLab:
    type: application
    platform: iOS
    sources:
      - path: DroverLab
      - path: Shared
      - path: ../app/src/main/assets/third_party_licenses.txt
        buildPhase: resources
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: NetworkExtension.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: DroverLab/DroverLab.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DroverLab/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.drover.ios.lab
        PRODUCT_NAME: Drover Lab
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    dependencies:
      - framework: Generated/tun2proxy.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacketTunnel/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.drover.ios.lab.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  DroverLab:
    build:
      targets:
        DroverLab: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
